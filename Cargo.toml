# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-postgres-plugin"
version = "1.0.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:store plugin cdylib: the Postgres backend for busbar's durable governance store, exported over the store C ABI. Drop the built library into the plugins folder and set governance.store: postgres to share virtual keys, budgets, and usage across a fleet of busbar nodes."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]   # cdylib for the C ABI delivery; all the SQL/logic lives in busbar-store-postgres

[dependencies]
# INTERIM: busbarAI isn't public yet, so these are local path dependencies into a sibling checkout of
# the monorepo. Once busbarAI ships publicly these should become git (pinned rev/tag) or crates.io
# dependencies instead — same pattern being applied to headroom-hook's/webrequest-hook's busbar-plugin-sdk
# dependency. busbar-store-postgres is the logic crate (all the SQL lives there, see its own doc comment);
# this cdylib only adapts the engine's JSON config into a PostgresStore.
busbar-api = { path = "../busbarAI/crates/api" }
busbar-store-postgres = { path = "../busbarAI/crates/store-postgres" }
busbar-plugin-sdk = { path = "../busbarAI/crates/plugin-sdk" }
serde_json = "1"

[dev-dependencies]
# INTERIM local path deps, same rationale as above — these are dev-only (the end-to-end test loads the
# built cdylib over the real loader ABI seam, and independently re-verifies persistence via the plain
# PostgresStore — already a normal dependency above — bypassing the cdylib/ABI entirely), never shipped
# in the plugin artifact itself.
busbar-plugin-loader = { path = "../busbarAI/crates/plugin-loader" }
postgres = "0.19"
