# Codecov is INFORMATIONAL here, never a gate. The correctness gate is the reusable `ci` job
# (GetBusbar/busbar plugin-ci.yml); coverage is an observation surfaced on the README badge and as
# per-PR context. So:
#   * status.*.informational: true  → Codecov posts a check for visibility but it is NEVER "failing",
#     so it can never block a PR or turn a branch red over a coverage delta.
#   * comment: false                → no bot comments on PRs; the signal lives on the badge + the
#     Codecov UI, keeping PRs seamless.
#   * ignore                        → exclude test-only / non-product paths so the reported
#     percentage reflects the shipped store code, not test fixtures and harnesses.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

ignore:
  - "**/tests"
  - "tests"
